---
- project:
    name: openstack-k8s-operators/prometheus-podman-exporter
    github-check:
      jobs:
        - telemetry-container-image-content-provider:
            override-checkout: master
            vars:
              container_images:
                - src: "{{ ansible_user_dir }}/src/github.com/openstack-k8s-operators/prometheus-podman-exporter"
                  name: prometheus-podman-exporter
                  update_var: cifmw_update_containers_edpmpodmanexporterImage
            irrelevant-files: &irrelevant-files
              - .github/.*
              - contrib/.*
              - hack/.*
              - rpm/.*
              - .gitignore
              - .golangci.yaml
              - .packit.yml
              - .pre-commit-config.yaml
              - .*.md$
              - LICENCE
              - OWNERS
              - VERSION
              - Vagrantfile
        - telemetry-openstack-meta-content-provider-master:
            override-checkout: main
            irrelevant-files: *irrelevant-files
        - functional-tests-osp18:
            required-projects:
              - name: infrawatch/feature-verification-tests
                override-checkout: master
            dependencies:
              - telemetry-openstack-meta-content-provider-master
              - telemetry-container-image-content-provider
            vars:
              cifmw_update_containers: true
            irrelevant-files: *irrelevant-files
        - s2i-openstack-container-content-provider
        - telemetry-operator-multinode-default-telemetry:
            required-projects:
              - name: openstack-k8s-operators/s2i-openstack-containers
                override-checkout: main
              - name: openstack-k8s-operators/telemetry-operator
                override-checkout: main
              - name: infrawatch/feature-verification-tests
                override-checkout: master
            dependencies:
              - s2i-openstack-container-content-provider
              - telemetry-container-image-content-provider
            vars:
              cifmw_update_containers: true
              cifmw_crc_additional_insecure_registries:
                - "{{ s2i_content_provider_registry_ip }}:5001"
              cifmw_crc_additional_allowed_registries:
                - "{{ s2i_content_provider_registry_ip }}:5001"
              cifmw_set_containers_preserve_unlisted: true
              cifmw_set_containers_images: >-
                {{ s2i_content_provider_os_custom_container_images |
                   dict2items |
                   json_query('[].{name: key, full_registry: value}') }}
            irrelevant-files: *irrelevant-files
        - feature-verification-tests-noop:
            files: *irrelevant-files
